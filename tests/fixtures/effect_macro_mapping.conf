# midi mapping fixture for effect selector/macro controls
name=Effect Macro Test

# direct bindings still coexist with effect macro controls.
attack=cc:1:1:linear:0.001:2.0

# selector ranges:
#   0..25    saturation
#   26..51   distortion
#   52..76   bitcrusher
#   77..102  delay
#   103..127 plate_reverb
effect_selector=cc:1:10
effect_macro_1=cc:1:11
effect_macro_2=cc:1:12
effect_macro_3=cc:1:13
