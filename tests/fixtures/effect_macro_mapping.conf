# midi mapping fixture for effect selector/macro controls
name=Effect Macro Test

# direct bindings still coexist with effect macro controls.
attack=cc:1:1:linear:0.001:2.0

# bank 1 selector ranges:
#   0..25    saturation
#   26..51   distortion
#   52..76   bitcrusher
#   77..102  delay
#   103..127 plate_reverb
effect_selector_1=cc:1:10
effect_1_macro_1=cc:1:11
effect_1_macro_2=cc:1:12
effect_1_macro_3=cc:1:13

# bank 2 selector ranges:
#   0..25    flanger
#   26..51   ring_mod
#   52..76   eq
#   77..127  blank
effect_selector_2=cc:1:14
effect_2_macro_1=cc:1:15
effect_2_macro_2=cc:1:16
effect_2_macro_3=cc:1:17
