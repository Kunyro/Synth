effect_selector_1=cc:1:25
effect_1_macro_1=cc:1:26
effect_1_macro_2=cc:1:27
effect_1_macro_3=cc:1:28
effect_selector_2=cc:1:29
effect_2_macro_1=cc:1:30
effect_2_macro_2=cc:1:31
effect_2_macro_3=cc:1:32

# format: chord_pad=cc:channel:control
chord_diminished=cc:1:33
chord_minor=cc:1:34
chord_major=cc:1:35
chord_suspended=cc:1:36
chord_6=cc:1:37
chord_minor_7=cc:1:38
chord_major_7=cc:1:39
chord_9=cc:1:40
